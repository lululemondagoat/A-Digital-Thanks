kind = "web"
previewPath = "/"
title = "Digital Thank You Card"
version = "1.0.0"
id = "artifacts/thank-you-card"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18819

[services.development]
run = "pnpm --filter @workspace/thank-you-card run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/thank-you-card", "run", "build" ]
publicDir = "artifacts/thank-you-card/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18819"
BASE_PATH = "/"
